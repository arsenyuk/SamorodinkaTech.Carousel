# Клиентский IP для API: XFF от Caddy (цепочка заканчивается реальным клиентом);
# при прямом обращении мимо Caddy — TCP-пир ($remote_addr).
# ВАЖНО: НЕ дописываем свой $remote_addr — иначе .NET (разбор справа налево)
# возьмёт внутренний IP хопа вместо клиента.
map $http_x_forwarded_for $client_ip {
    ""      $remote_addr;
    default $http_x_forwarded_for;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback (Mini App routes like /edit/{id})
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + health — proxied to the api container
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
    }

    location = /health {
        proxy_pass http://api:8080;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Real-IP $client_ip;
    }
}